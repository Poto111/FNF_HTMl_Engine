<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Optimized FNF Engine (.SCH Support + Working Health & Sustains)</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAADISURBVEhL7c/BCcJAEIXhXOzBgzkINmMBguDRRmzDq9qHbZgOQsCLDeiTB8tkNiHDZFc0CB+BbML7k+JYNVm9A7N5mckkA4/dXt6OpANYvy9WuAbhkU8rwHUpcQDY4LdTeOSjAzB+VOoIpGUK4AVS5xbWQHGq/4E+XCdHYzgAbDjWwRQA3zpYA7FNvVUnnZwBrJe3paXhCXCdBhtf+QcwiQCp85gz0Od6eKqTBAGMBuf1RTXSBLArycYv/IGk1iFxIPapQEZV8wKcmnFMgNkWogAAAABJRU5ErkJggg==">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }
        h1 { font-size: 1.3rem; margin-bottom: 5px; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .game-container {
            display: flex;
            flex-direction: row;
            width: 820px;
            height: 520px;
            position: relative;
        }
        .playfield {
            position: relative;
            width: 50%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            border-right: 2px solid #333;
            overflow: hidden;
        }
        .playfield:last-child { border-right: none; }
        
        /* Barra de vida mejorada y funcional */
        .enemy-health-bar {
            position: absolute;
            right: 10px;
            top: 20px;
            width: 14px;
            height: 480px;
            background: #222;
            border: 2px solid #555;
            border-radius: 7px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }
        .enemy-health-fill {
            width: 100%;
            height: 50%; /* Comienza a la mitad (50%) */
            background: #00ffff; /* Celeste por defecto */
            transition: height 0.05s linear, background 0.3s;
        }
        .receptor-line {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-around;
            padding: 0 15px;
        }
        .receptor {
            width: 65px;
            height: 65px;
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.05s, background 0.05s, border-color 0.05s;
        }
        .receptor.pressed {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }
        .note {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
        }
        .note-sustain {
            position: absolute;
            width: 22px;
            pointer-events: none;
            opacity: 0.6;
            border-radius: 4px;
            transform: translateX(-50%);
            left: 50%;
        }
        
        .lane-0 { color: #ff2233; border-color: #ff2233; background: rgba(255,34,51,0.2); }
        .lane-1 { color: #00ddff; border-color: #00ddff; background: rgba(0,221,255,0.2); }
        .lane-2 { color: #10cc44; border-color: #10cc44; background: rgba(16,204,68,0.2); }
        .lane-3 { color: #cc11ff; border-color: #cc11ff; background: rgba(204,17,255,0.2); }
        
        .lane-4 { color: #ff2233; border-color: #ff2233; background: rgba(255,34,51,0.2); }
        .lane-5 { color: #00ddff; border-color: #00ddff; background: rgba(0,221,255,0.2); }
        .lane-6 { color: #10cc44; border-color: #10cc44; background: rgba(16,204,68,0.2); }
        .lane-7 { color: #cc11ff; border-color: #cc11ff; background: rgba(204,17,255,0.2); }
        .floating-score {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            border: 1px solid #00ffff;
            z-index: 20;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ui-panel, .editor-container {
            width: 820px;
            transition: all 0.3s ease;
        }
        .ui-panel {
            margin-top: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
            justify-content: space-between;
        }
        .stats { font-size: 0.85rem; font-weight: bold; }
        .editor-container {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #151515;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 5px;
            font-family: monospace;
            font-size: 11px;
            resize: vertical;
        }
        button, input[type="file"] {
            background: #00cbcb;
            color: black;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #000000; }
        
        #feedback {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
            transition: opacity 0.2s;
            opacity: 0;
            z-index: 10;
        }
        body.fullscreen-mode h1,
        body.fullscreen-mode .ui-panel,
        body.fullscreen-mode .editor-container {
            display: none !important;
        }
        body.fullscreen-mode {
            justify-content: center;
            background: #000;
        }
        body.fullscreen-mode .game-wrapper {
            border: none;
            box-shadow: none;
        }
        body.fullscreen-mode .floating-score {
            display: block !important;
        }
    </style>
</head>
<body>
    <h1>Super Optimized FNF Engine</h1>
    
    <div class="game-wrapper" id="game-wrapper">
        <div class="floating-score" id="floating-score">Score: 0 | Misses: 0 | Acc: 100%</div>
        <div class="game-container">
            <div class="playfield" id="pf-cpu">
                <div class="receptor-line" id="receptors-cpu">
                    <div class="receptor lane-0">←</div>
                    <div class="receptor lane-1">↓</div>
                    <div class="receptor lane-2">↑</div>
                    <div class="receptor lane-3">→</div>
                </div>
            </div>
            <div class="playfield" id="pf-player">
                <div id="feedback">SICK!</div>
                <div class="enemy-health-bar">
                    <div class="enemy-health-fill" id="enemy-health"></div>
                </div>
                <div class="receptor-line" id="receptors-player">
                    <div class="receptor lane-4" data-key="4">←</div>
                    <div class="receptor lane-5" data-key="5">↓</div>
                    <div class="receptor lane-6" data-key="6">↑</div>
                    <div class="receptor lane-7" data-key="7">→</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="ui-panel">
        <div>
            <label style="font-size: 0.85rem;">Audio: </label>
            <input type="file" id="audiofile" accept="audio/*">
        </div>
        <button id="btn-start">¡Iniciar Juego!</button>
        <button id="btn-fullscreen" style="background:#00bcd4;">Pantalla Completa Entorno</button>
        <div class="stats" id="score-board">Score: 0 | Misses: 0 | Acc: 100%</div>
    </div>
    
    <div class="editor-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="font-size: 0.85rem;">Pega tu Chart o Sube un archivo .sch:</label>
            <input type="file" id="schfile" accept=".sch" style="padding: 3px 8px; font-size: 0.8rem;">
        </div>
        <textarea id="chart-input"> </textarea>
    </div>
    <h1>Poto111</h1>
    <script>
        const scrollSpeed = 0.6;
        let notes = [];
        let score = 0;
        let misses = 0;
        let hits = 0;
        let totalNotes = 0;
        let gameRunning = false;
        let audioEl = null;
        let startTime = 0;
        let health = 50; // Vida inicial (0% a 100%)
        const keyMap = {
            'KeyD': 4, 'ArrowLeft': 4,
            'KeyF': 5, 'ArrowDown': 5,
            'KeyJ': 6, 'ArrowUp': 6,
            'KeyK': 7, 'ArrowRight': 7
        };
        const activeKeys = [false, false, false, false];
        document.getElementById('schfile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('chart-input').value = evt.target.result;
            };
            reader.readAsText(file);
        });
        function parseChart(text) {
            const lines = text.trim().split('\n');
            let parsed = [];
            lines.forEach(line => {
                const match = line.match(/\{([^}]+)\}:\s*\{([^}]+)\}:\s*\{([^}]+)\}:\s*\{([^}]+)\}/);
                if (match) {
                    const timeSec = parseFloat(match[1]);
                    const laneRaw = parseInt(match[2]);
                    const sustainDur = parseFloat(match[4]);
                    
                    let lane = -1;
                    if (laneRaw >= 1 && laneRaw <= 8) {
                        lane = laneRaw - 1;
                    }
                    if (lane !== -1) {
                        parsed.push({
                            time: timeSec * 1000,
                            lane: lane,
                            sustain: sustainDur * 1000, // Convertido a milisegundos
                            hit: false,
                            missed: false,
                            holding: false,
                            sustainFinished: false,
                            element: null,
                            sustainElement: null
                        });
                    }
                }
            });
            return parsed.sort((a, b) => a.time - b.time);
        }
        function initGame() {
            const chartText = document.getElementById('chart-input').value;
            notes = parseChart(chartText);
            totalNotes = notes.filter(n => n.lane >= 4).length;
            score = 0;
            misses = 0;
            hits = 0;
            health = 50;
            updateHealthBar();
            updateScoreBoard();
            
            document.querySelectorAll('.note, .note-sustain').forEach(el => el.remove());
            const pfCpu = document.getElementById('pf-cpu');
            const pfPlayer = document.getElementById('pf-player');
            
            notes.forEach(note => {
                const isPlayer = note.lane >= 4;
                const container = isPlayer ? pfPlayer : pfCpu;
                
                const noteEl = document.createElement('div');
                noteEl.className = `note lane-${note.lane}`;
                noteEl.innerText = ['←', '↓', '↑', '→', '←', '↓', '↑', '→'][note.lane];
                container.appendChild(noteEl);
                note.element = noteEl;
                
                if (note.sustain > 0) {
                    const susEl = document.createElement('div');
                    susEl.className = `note-sustain lane-${note.lane}`;
                    container.appendChild(susEl);
                    note.sustainElement = susEl;
                }
            });
            const fileInput = document.getElementById('audiofile');
            if (audioEl) audioEl.pause();
            
            if (fileInput.files && fileInput.files[0]) {
                audioEl = new Audio(URL.createObjectURL(fileInput.files[0]));
            } else {
                audioEl = null;
            }
            gameRunning = true;
            startTime = performance.now();
            if (audioEl) audioEl.play();
            requestAnimationFrame(gameLoop);
        }
        const receptorY = 50;
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            const currentTime = audioEl && !audioEl.paused ? audioEl.currentTime * 1000 : (timestamp - startTime);
            
            notes.forEach(note => {
                const timeDiff = note.time - currentTime;
                const posY = receptorY + (timeDiff * scrollSpeed);
                const localLane = note.lane % 4;
                if (note.element) {
                    let susHeight = note.sustain > 0 ? (note.sustain * scrollSpeed) / 1000 : 0;
                    let susPosY = posY + 65;
                    if (posY < -100 || posY > 550) {
                        note.element.style.display = 'none';
                    } else {
                        note.element.style.display = 'flex';
                        note.element.style.top = `${posY}px`;
                        note.element.style.left = `${25 + localLane * 95}px`;
                    }
                    if (note.sustainElement && note.sustain > 0) {
                        let susBottom = susPosY + susHeight;
                        if (susBottom < receptorY) {
                            note.sustainElement.style.display = 'none';
                        } else {
                            note.sustainElement.style.display = 'block';
                            if (posY < receptorY) {
                                let offset = receptorY - posY;
                                note.sustainElement.style.top = `${receptorY}px`;
                                note.sustainElement.style.height = `${Math.max(0, susHeight - offset)}px`;
                            } else {
                                note.sustainElement.style.top = `${susPosY}px`;
                                note.sustainElement.style.height = `${susHeight}px`;
                            }
                            note.sustainElement.style.left = `${57 + localLane * 95}px`;
                        }
                    }
                    // Lógica para notas sostenidas en curso (mientras se mantienen presionadas)
                    if (note.lane >= 4 && note.holding && !note.sustainFinished) {
                        const activeIndex = note.lane - 4;
                        const endTime = note.time + note.sustain;
                        
                        if (activeKeys[activeIndex] && currentTime <= endTime) {
                            health = Math.min(100, health + 0.15); // Aumenta vida gradualmente
                            updateHealthBar();
                        } else {
                            note.holding = false;
                            note.sustainFinished = true;
                        }
                        if (currentTime > endTime) {
                            note.holding = false;
                            note.sustainFinished = true;
                        }
                    }
                    // Autoplay CPU
                    if (note.lane < 4 && Math.abs(timeDiff) < 15 && !note.hit) {
                        note.hit = true;
                        triggerReceptor(note.lane);
                        note.element.style.opacity = '0.3';
                    }
                }
                // Detección de fallo (MISS)
                if (note.lane >= 4 && !note.hit && !note.missed && timeDiff < -160) {
                    note.missed = true;
                    misses++;
                    health = Math.max(0, health - 6); // Pierde vida por miss
                    updateHealthBar();
                    showFeedback("MISS", "#ff2233");
                    updateScoreBoard();
                }
            });
            requestAnimationFrame(gameLoop);
        }
        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            const lane = keyMap[e.code];
            if (lane !== undefined) {
                const activeIndex = lane - 4;
                if (!activeKeys[activeIndex]) {
                    activeKeys[activeIndex] = true;
                    highlightReceptor(lane, true);
                    checkHit(lane);
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            const lane = keyMap[e.code];
            if (lane !== undefined) {
                const activeIndex = lane - 4;
                activeKeys[activeIndex] = false;
                highlightReceptor(lane, false);
                
                // Si suelta la tecla, corta el sustain activo de ese carril
                notes.forEach(note => {
                    if (note.lane === lane && note.holding) {
                        note.holding = false;
                        note.sustainFinished = true;
                    }
                });
            }
        });
        function highlightReceptor(lane, pressed) {
            const targetLane = lane % 4;
            const receptors = document.querySelectorAll('#receptors-player .receptor');
            if (receptors[targetLane]) {
                if (pressed) receptors[targetLane].classList.add('pressed');
                else receptors[targetLane].classList.remove('pressed');
            }
        }
        function triggerReceptor(lane) {
            const isPlayer = lane >= 4;
            const receptors = document.querySelectorAll(isPlayer ? '#receptors-player .receptor' : '#receptors-cpu .receptor');
            const targetLane = lane % 4;
            if (receptors[targetLane]) {
                if(!receptors[targetLane].classList.contains('pressed')) {
                    receptors[targetLane].classList.add('pressed');
                    setTimeout(() => receptors[targetLane].classList.remove('pressed'), 80);
                }
            }
        }
        function checkHit(lane) {
            const currentTime = audioEl && !audioEl.paused ? audioEl.currentTime * 1000 : (performance.now() - startTime);
            let closestNote = null;
            let minDiff = Infinity;
            
            notes.forEach(note => {
                if (note.lane === lane && !note.hit && !note.missed) {
                    const diff = Math.abs(note.time - currentTime);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestNote = note;
                    }
                }
            });
            if (closestNote && minDiff <= 160) {
                closestNote.hit = true;
                if (closestNote.element) closestNote.element.style.display = 'none';
                
                // Si tiene sustain, lo marca como en proceso de sostenimiento
                if (closestNote.sustain > 0) {
                    closestNote.holding = true;
                }
                hits++;
                if (minDiff < 45) { score += 350; health = Math.min(100, health + 3); showFeedback("SICK!", "#00ffcc"); }
                else if (minDiff < 90) { score += 200; health = Math.min(100, health + 2); showFeedback("GOOD!", "#00ccff"); }
                else if (minDiff < 130) { score += 100; health = Math.min(100, health + 1); showFeedback("BAD", "#ffaa00"); }
                else { score += 50; health = Math.min(100, health + 0.5); showFeedback("SH*T", "#ff2233"); }
                
                updateHealthBar();
                updateScoreBoard();
            }
        }
        function showFeedback(text, color) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.style.color = color;
            fb.style.opacity = '1';
            setTimeout(() => { fb.style.opacity = '0'; }, 150);
        }
        function updateHealthBar() {
            const healthFill = document.getElementById('enemy-health');
            if (healthFill) {
                healthFill.style.height = `${health}%`;
                // Cambia de color dinámicamente según la vida (Rojo si baja de 20%, Verde normal)
                if (health < 20) {
                    healthFill.style.background = '#ff2233';
                } else {
                    healthFill.style.background = '#10cc44';
                }
            }
        }
        function updateScoreBoard() {
            const totalJudged = hits + misses;
            const accuracy = totalJudged > 0 ? ((hits / totalJudged) * 100).toFixed(2) : 100;
            const scoreText = `Score: ${score} | Misses: ${misses} | Acc: ${accuracy}%`;
            
            document.getElementById('score-board').innerText = scoreText;
            const floatingScore = document.getElementById('floating-score');
            if (floatingScore) {
                floatingScore.innerText = scoreText;
            }
        }
        document.getElementById('btn-start').addEventListener('click', initGame);
        
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            document.body.classList.toggle('fullscreen-mode');
            const isFull = document.body.classList.contains('fullscreen-mode');
            document.getElementById('btn-fullscreen').innerText = isFull ? "Salir Pantalla Completa" : "Pantalla Completa Entorno";
        });
    </script>
</body>
</html>
